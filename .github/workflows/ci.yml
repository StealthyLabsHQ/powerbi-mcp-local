name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Strict registry audit on every CI run: every public pbi_*_tool must
      # have an @mcp.tool() wrapper. Fails fast on registration drift.
      PBI_MCP_AUDIT: "1"
      PBI_MCP_STRICT_REGISTRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Linux: skip pythonnet + pbi-pyadomd (require .NET, Windows-only PBI Desktop)
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            pip install "mcp[cli]~=1.27.0" openpyxl~=3.1.5 psutil~=7.2.2
            pip install pytest~=8.3 pytest-cov~=5.0
          else
            pip install -e ".[dev]"
          fi

      - name: Syntax + import smoke
        shell: bash
        run: |
          python -c "
          import ast, pathlib
          for p in pathlib.Path('src').rglob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'))
          print('syntax OK')
          "

      - name: Run tests (Windows — full)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pytest -q --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=62

      - name: Run tests (Linux — full offline suite)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        # pythonnet/pbi-pyadomd are Windows-only but only imported lazily at
        # connection time; the whole suite is offline-mocked and carries its
        # own platform guards, so no hardcoded file allowlist is needed.
        run: pytest -q

      - name: Upload coverage XML
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff~=0.6"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  tool-count:
    name: README tool-count drift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Compare registered tool count to README badge
        shell: bash
        run: |
          actual=$(python scripts/tool_count.py | awk '/^total:/ {print $2}')
          badge=$(grep -oE 'Tools%20[0-9]+|Tools [0-9]+' README.md | head -1 | grep -oE '[0-9]+')
          echo "registered=$actual readme=$badge"
          if [ "$actual" != "$badge" ]; then
            echo "::error::README tool badge ($badge) != registered tools ($actual). Run scripts/tool_count.py and update README.md."
            exit 1
          fi
